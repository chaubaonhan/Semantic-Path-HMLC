[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-path-hmlc"
version = "1.0.0"
description = "Frozen label semantics and taxonomy graph fusion for single-path hierarchical text classification"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Bao Nhan Chau" },
    { name = "Phuoc Tran" },
]

[tool.setuptools.packages.find]
where = ["src"]
